name: Tender Hunter — EGP (Bid)
on:
  schedule:
    # Active hours only — sources don't post new tenders after 7pm Addis
    # (UTC+3). 03:00-17:00 UTC ≈ 06:00-20:00 Addis (with 1h buffer past 7pm
    # for late stragglers). Two runs per hour, every 30 minutes, at off-peak
    # minutes (avoiding GitHub's high-load 0/15/30/45 slots).
    - cron: '7 3-17 * * *'
    - cron: '37 3-17 * * *'
  workflow_dispatch:

# If a run is still in progress when the next one is scheduled, cancel it.
# This prevents the queue-backlog bursts (clusters of runs close together
# followed by long gaps) that GitHub's delayed scheduling otherwise causes.
# Runs are short and incremental, so a cancelled run loses little; the next
# run picks up the same tenders via the cache.
concurrency:
  group: tender-hunter-egp
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore EGP cache
        uses: actions/cache@v4
        with:
          path: .opencode/data/tender-cache-egp.json
          # Unique key per run; restore-keys pulls the latest matching prefix.
          key: tender-cache-egp-${{ github.run_id }}
          restore-keys: |
            tender-cache-egp-

      - name: Install dependencies
        run: cd .opencode && npm ci

      # No Playwright/browser install: the EGP workflow uses a public JSON API,
      # not a browser. Skipping this step saves ~1-2 min per run. The playwright
      # npm package is still installed by `npm ci` but never required (the
      # scraper loads it lazily inside scrapeMerkato only).

      - name: Run EGP scraper (tendering / bid only)
        env:
          RUN_SOURCE: egp
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_EGP }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID_EGP }}
          TENDERFLOW_API_KEY: ${{ secrets.TENDERFLOW_API_KEY }}
          # Manual runs always emit a digest (even when nothing is new) so a
          # quiet day is distinguishable from a broken run.
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: node .opencode/scripts/tender-scraper.js

      # Alert when a run fails so outages (API change, Telegram error, the
      # 60-day auto-disable, etc.) don't go unnoticed. Uses the second bot.
      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_EGP }}
          IDS: ${{ secrets.TELEGRAM_USER_ID_EGP }}
        run: |
          IFS=',' read -ra ARR <<< "$IDS"
          for id in "${ARR[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"$id\",\"text\":\"⚠️ Tender Hunter (EGP bid) run failed at $(date -u). Check the Actions log.\",\"parse_mode\":\"Markdown\"}"
          done
