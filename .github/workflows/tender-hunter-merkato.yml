name: Tender Hunter — 2Merkato
on:
  schedule:
    # Active hours only — sources don't post new tenders after 7pm Addis
    # (UTC+3). 03:00-17:00 UTC ≈ 06:00-20:00 Addis (with 1h buffer past 7pm
    # for late stragglers). Two runs per hour, every 30 minutes, at off-peak
    # minutes (avoiding GitHub's high-load 0/15/30/45 slots).
    - cron: '7 3-17 * * *'
    - cron: '37 3-17 * * *'
  workflow_dispatch:

# If a run is still in progress when the next one is scheduled, cancel it.
# This prevents the queue-backlog bursts (clusters of runs close together
# followed by long gaps) that GitHub's delayed scheduling otherwise causes.
# Runs are short and incremental, so a cancelled run loses little; the next
# run picks up the same tenders via the cache.
concurrency:
  group: tender-hunter-merkato
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore 2Merkato cache
        uses: actions/cache@v4
        with:
          path: .opencode/data/tender-cache-merkato.json
          # Unique key per run; restore-keys pulls the latest matching prefix.
          key: tender-cache-merkato-${{ github.run_id }}
          restore-keys: |
            tender-cache-merkato-

      - name: Install dependencies
        run: cd .opencode && npm ci

      - name: Install Playwright browsers
        run: cd .opencode && npx playwright install chromium --with-deps

      - name: Run 2Merkato scraper
        env:
          RUN_SOURCE: merkato
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          MERKATO_EMAIL: ${{ secrets.MERKATO_EMAIL }}
          MERKATO_PASSWORD: ${{ secrets.MERKATO_PASSWORD }}
          TENDERFLOW_API_KEY: ${{ secrets.TENDERFLOW_API_KEY }}
          # Manual runs always emit a digest (even when nothing is new) so a
          # quiet day is distinguishable from a broken run.
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: node .opencode/scripts/tender-scraper.js

      # Alert when a run fails so outages (site change, login break, Telegram
      # error, the 60-day auto-disable, etc.) don't go unnoticed.
      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IDS: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          IFS=',' read -ra ARR <<< "$IDS"
          for id in "${ARR[@]}"; do
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"$id\",\"text\":\"⚠️ Tender Hunter (2Merkato) run failed at $(date -u). Check the Actions log.\",\"parse_mode\":\"Markdown\"}"
          done
